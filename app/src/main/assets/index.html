<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tracer</title>
<style>
  :root {
    --panel: rgba(16, 16, 20, 0.88);
    --fg: #f2f2f5;
    --muted: #9a9aa5;
    --accent: #4cc2ff;
    --btn: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }

  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; overflow: hidden; background: #000; }
  #cam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #white { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; display: none; }

  #layer { position: absolute; left: 50%; top: 50%; transform-origin: center center; will-change: transform; display: none; }
  #cv { display: block; width: 100%; height: 100%; }
  #grid {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px rgba(255, 64, 129, 0.85);
    background-image:
      linear-gradient(to right, rgba(255, 64, 129, 0.85) 0, rgba(255, 64, 129, 0.85) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(255, 64, 129, 0.85) 0, rgba(255, 64, 129, 0.85) 1.5px, transparent 1.5px);
  }

  #hint {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    max-width: 82%; padding: 14px 18px; border-radius: 14px; text-align: center;
    background: var(--panel); font-size: 15px; line-height: 1.4; pointer-events: none;
  }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border-top-left-radius: 18px; border-top-right-radius: 18px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { font-size: 13px; color: var(--muted); width: 58px; flex: none; }
  #opacity { flex: 1; height: 36px; accent-color: var(--accent); }
  #opVal { width: 42px; text-align: right; font-size: 13px; color: var(--muted); flex: none; }

  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .b {
    border: 0; border-radius: 12px; background: var(--btn); color: var(--fg);
    padding: 9px 2px 7px; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .b i { font-style: normal; font-size: 21px; line-height: 1; }
  .b span { font-size: 11.5px; color: var(--muted); }
  .b:active { background: rgba(255, 255, 255, 0.18); }
  .b.on { background: rgba(76, 194, 255, 0.28); }
  .b.on span { color: var(--fg); }

  #fab {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 46px; height: 46px; border-radius: 50%; border: 0; display: none;
    background: rgba(16, 16, 20, 0.6); color: var(--fg); font-size: 20px; opacity: 0.55;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="white"></div>
  <div id="layer">
    <canvas id="cv"></canvas>
    <div id="grid"></div>
  </div>
</div>

<div id="hint">Tap <b>Photo</b> to pick a picture to trace.<br>Place your paper under the phone.</div>

<div id="panel">
  <div class="row">
    <label for="opacity">Opacity</label>
    <input id="opacity" type="range" min="5" max="100" step="1" value="50">
    <div id="opVal">50%</div>
  </div>
  <div class="btns">
    <button class="b" id="bPhoto"><i>🖼️</i><span>Photo</span></button>
    <button class="b" id="bMode"><i>🎨</i><span id="tMode">Color</span></button>
    <button class="b" id="bGrid"><i>▦</i><span id="tGrid">Grid off</span></button>
    <button class="b" id="bFlip"><i>⇋</i><span>Flip</span></button>
    <button class="b" id="bBg"><i>📷</i><span id="tBg">Camera</span></button>
    <button class="b" id="bLock"><i>🔓</i><span id="tLock">Unlocked</span></button>
    <button class="b" id="bReset"><i>↺</i><span>Reset</span></button>
    <button class="b" id="bHide"><i>▾</i><span>Hide</span></button>
  </div>
</div>
<button id="fab" aria-label="Show controls">☰</button>

<input id="file" type="file" accept="image/*" hidden>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), cam = $('cam'), white = $('white'), layer = $('layer'),
      cv = $('cv'), grid = $('grid'), fileIn = $('file'), opacity = $('opacity'),
      opVal = $('opVal'), panel = $('panel'), fab = $('fab'), hint = $('hint');

  var MODES = ['Color', 'Gray', 'Outline'];
  var GRIDS = [0, 3, 4, 6, 8];

  var st = { x: 0, y: 0, s: 1, r: 0, flip: 1, locked: false, mode: 0, gridIdx: 0, bg: 'cam', op: 50 };
  var srcImg = null, prevUrl = null, stream = null;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- saved settings ----------
  function save() {
    try {
      localStorage.setItem('tracer', JSON.stringify({ op: st.op, mode: st.mode, gridIdx: st.gridIdx, bg: st.bg }));
    } catch (e) {}
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem('tracer') || 'null');
      if (o) {
        if (typeof o.op === 'number') st.op = clamp(o.op, 5, 100);
        if (typeof o.mode === 'number' && o.mode >= 0 && o.mode < MODES.length) st.mode = o.mode;
        if (typeof o.gridIdx === 'number' && o.gridIdx >= 0 && o.gridIdx < GRIDS.length) st.gridIdx = o.gridIdx;
        if (o.bg === 'cam' || o.bg === 'white') st.bg = o.bg;
      }
    } catch (e) {}
  }

  // ---------- transform ----------
  function applyTransform() {
    layer.style.transform =
      'translate(-50%,-50%) translate(' + st.x + 'px,' + st.y + 'px) rotate(' + st.r + 'rad) scale(' +
      (st.s * st.flip) + ',' + st.s + ')';
  }

  function fit() {
    if (!srcImg) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    var a = srcImg.naturalWidth / srcImg.naturalHeight;
    var w = Math.min(W * 0.92, H * 0.78 * a);
    var h = w / a;
    layer.style.width = w + 'px';
    layer.style.height = h + 'px';
    st.x = 0; st.y = 0; st.s = 1; st.r = 0; st.flip = 1;
    applyTransform();
  }

  // ---------- drawing the image (color / gray / outline) ----------
  function render() {
    if (!srcImg) return;
    var iw = srcImg.naturalWidth, ih = srcImg.naturalHeight;
    var sc = Math.min(1, 1600 / Math.max(iw, ih));
    var w = Math.max(1, Math.round(iw * sc)), h = Math.max(1, Math.round(ih * sc));
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(srcImg, 0, 0, w, h);
    if (st.mode === 0) return;

    var img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h, i, j;
    var g = new Float32Array(n);
    for (i = 0, j = 0; i < d.length; i += 4, j++) {
      g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    }

    if (st.mode === 1) {
      for (i = 0, j = 0; i < d.length; i += 4, j++) {
        var v = clamp((g[j] - 128) * 1.25 + 128, 0, 255);
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
      }
      ctx.putImageData(img, 0, 0);
      return;
    }

    // Outline: light blur, then Sobel edge detection -> dark lines on transparent background
    var b = new Float32Array(n), x, y, k;
    for (y = 1; y < h - 1; y++) {
      for (x = 1; x < w - 1; x++) {
        k = y * w + x;
        b[k] = (g[k - w - 1] + g[k - w] + g[k - w + 1] + g[k - 1] + g[k] + g[k + 1] +
                g[k + w - 1] + g[k + w] + g[k + w + 1]) / 9;
      }
    }
    var out = ctx.createImageData(w, h), o = out.data;
    for (y = 2; y < h - 2; y++) {
      for (x = 2; x < w - 2; x++) {
        k = y * w + x;
        var gx = -b[k - w - 1] - 2 * b[k - 1] - b[k + w - 1] + b[k - w + 1] + 2 * b[k + 1] + b[k + w + 1];
        var gy = -b[k - w - 1] - 2 * b[k - w] - b[k - w + 1] + b[k + w - 1] + 2 * b[k + w] + b[k + w + 1];
        var m = Math.sqrt(gx * gx + gy * gy);
        var a = clamp((m - 45) * 2.2, 0, 255);
        var p = k * 4;
        o[p] = 0; o[p + 1] = 0; o[p + 2] = 0; o[p + 3] = a;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  // ---------- opacity ----------
  function applyOpacity() {
    cv.style.opacity = st.op / 100;
    opacity.value = st.op;
    opVal.textContent = st.op + '%';
  }
  opacity.addEventListener('input', function () {
    st.op = parseInt(opacity.value, 10);
    applyOpacity();
  });
  opacity.addEventListener('change', save);

  // ---------- gestures: drag, pinch-zoom, two-finger rotate ----------
  var ptrs = {}, last = null;

  function snapshot() {
    var ids = Object.keys(ptrs), n = ids.length;
    if (n === 0) return null;
    var p1 = ptrs[ids[0]], p2 = n > 1 ? ptrs[ids[1]] : null;
    var s = { n: n >= 2 ? 2 : 1, cx: p1.x, cy: p1.y, d: 0, a: 0 };
    if (p2) {
      s.cx = (p1.x + p2.x) / 2; s.cy = (p1.y + p2.y) / 2;
      s.d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      s.a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    }
    return s;
  }

  stage.addEventListener('pointerdown', function (e) {
    if (st.locked || !srcImg) return;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    last = snapshot();
  });

  stage.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var cur = snapshot();
    if (last && cur && cur.n === last.n) {
      st.x += cur.cx - last.cx;
      st.y += cur.cy - last.cy;
      if (cur.n === 2 && last.d > 0) {
        st.s = clamp(st.s * cur.d / last.d, 0.05, 30);
        var da = cur.a - last.a;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        st.r += da;
      }
      applyTransform();
    }
    last = cur;
  });

  function endPtr(e) {
    delete ptrs[e.pointerId];
    last = snapshot();
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);

  // mouse wheel zoom (handy for testing on a computer)
  stage.addEventListener('wheel', function (e) {
    if (st.locked || !srcImg) return;
    e.preventDefault();
    st.s = clamp(st.s * (e.deltaY < 0 ? 1.08 : 0.92), 0.05, 30);
    applyTransform();
  }, { passive: false });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- camera ----------
  function showHint(html) {
    hint.innerHTML = html;
    hint.style.display = 'block';
  }

  function stopCam() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    cam.srcObject = null;
  }

  function startCam() {
    if (st.bg !== 'cam') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showHint('Camera not available on this device.<br>Use the <b>Camera</b> button to switch to a white background.');
      return;
    }
    stopCam();
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (s) {
      if (st.bg !== 'cam') { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      cam.srcObject = s;
      var p = cam.play();
      if (p && p.catch) p.catch(function () {});
    }).catch(function () {
      showHint('Camera is blocked.<br>Allow Camera for Tracer in your phone\'s app settings, or tap <b>Camera</b> to use a white background.');
    });
  }

  function applyBg() {
    var isCam = st.bg === 'cam';
    cam.style.display = isCam ? 'block' : 'none';
    white.style.display = isCam ? 'none' : 'block';
    $('tBg').textContent = isCam ? 'Camera' : 'White';
    $('bBg').firstChild.textContent = isCam ? '📷' : '⬜';
    if (isCam) startCam(); else stopCam();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && st.bg === 'cam') {
      var dead = !stream || !stream.active;
      if (!dead) {
        var tr = stream.getVideoTracks()[0];
        dead = !tr || tr.readyState === 'ended';
      }
      if (dead) startCam();
    }
  });

  // ---------- buttons ----------
  function setOn(id, on) { $(id).classList.toggle('on', !!on); }

  function applyMode() {
    $('tMode').textContent = MODES[st.mode];
    setOn('bMode', st.mode !== 0);
  }
  function applyGrid() {
    var n = GRIDS[st.gridIdx];
    $('tGrid').textContent = n ? ('Grid ' + n + '×' + n) : 'Grid off';
    setOn('bGrid', n > 0);
    if (n) {
      grid.style.display = 'block';
      grid.style.backgroundSize = (100 / n) + '% ' + (100 / n) + '%';
    } else {
      grid.style.display = 'none';
    }
  }
  function applyLock() {
    $('tLock').textContent = st.locked ? 'Locked' : 'Unlocked';
    $('bLock').firstChild.textContent = st.locked ? '🔒' : '🔓';
    setOn('bLock', st.locked);
    if (st.locked) { ptrs = {}; last = null; }
  }

  $('bPhoto').addEventListener('click', function () { fileIn.click(); });

  fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      srcImg = im;
      if (prevUrl) { try { URL.revokeObjectURL(prevUrl); } catch (e) {} }
      prevUrl = url;
      hint.style.display = 'none';
      layer.style.display = 'block';
      fit();
      render();
    };
    im.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (e) {}
      showHint('Could not open that image. Try another one.');
    };
    im.src = url;
    fileIn.value = '';
  });

  $('bMode').addEventListener('click', function () {
    st.mode = (st.mode + 1) % MODES.length;
    applyMode(); render(); save();
  });
  $('bGrid').addEventListener('click', function () {
    st.gridIdx = (st.gridIdx + 1) % GRIDS.length;
    applyGrid(); save();
  });
  $('bFlip').addEventListener('click', function () {
    st.flip = -st.flip;
    applyTransform();
  });
  $('bBg').addEventListener('click', function () {
    st.bg = st.bg === 'cam' ? 'white' : 'cam';
    hint.style.display = srcImg ? 'none' : hint.style.display;
    applyBg(); save();
  });
  $('bLock').addEventListener('click', function () {
    st.locked = !st.locked;
    applyLock();
  });
  $('bReset').addEventListener('click', function () { fit(); });
  $('bHide').addEventListener('click', function () {
    panel.style.display = 'none';
    fab.style.display = 'block';
  });
  fab.addEventListener('click', function () {
    panel.style.display = 'block';
    fab.style.display = 'none';
  });

  window.addEventListener('resize', function () {
    // keep the picture where it is; just refit if nothing has been moved yet
    if (srcImg && st.x === 0 && st.y === 0 && st.s === 1 && st.r === 0) fit();
  });

  // ---------- start ----------
  load();
  applyOpacity();
  applyMode();
  applyGrid();
  applyLock();
  applyBg();
})();
</script>
</body>
</html>
